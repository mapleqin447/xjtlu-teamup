<!DOCTYPE html>
<!-- XJTLUer Can Fly · 单文件版：样式、脚本、头像全部内联在这里，
     这个文件拷到哪里都能直接双击打开，不需要 assets 文件夹。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>XJTLUer Can Fly · 西浦学子会飞</title>
  <style>
/* 基础重置 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #eaf6ff 0%, #cfe8ff 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 16px;
}

/* 游戏外层容器：负责整体宽度和定位 */
#game-wrap {
  position: relative;
  width: 100%;
  max-width: 900px;
  overflow: hidden; /* 小屏上万一有东西溢出，也不许糊到游戏区外面 */
}

/* 画布：宽度自适应，高度按比例缩放 */
#game {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(30, 80, 140, 0.18);
  touch-action: none; /* 防止移动端拖动页面 */
}

/* 记分牌 */
#hud {
  position: absolute;
  top: 12px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  color: #123;
  font-size: 16px;
  z-index: 2; /* 要盖在开始/暂停浮层上面，⚙ 才点得到 */
}

#hud b {
  font-size: 20px;
}

/* 右上角按钮组 */
#hud-btns {
  display: flex;
  gap: 8px;
}

#pause-btn,
#settings-btn {
  pointer-events: auto;
  border: none;
  background: rgba(255, 255, 255, 0.85);
  color: #0b4a8f;
  font-size: 16px;
  line-height: 1;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
}

#pause-btn {
  display: none; /* 初始隐藏，游戏中显示 */
}

#pause-btn:hover,
#settings-btn:hover {
  background: #fff;
}

/* 开始 / 结束浮层 */
#overlay {
  position: absolute;
  /* 不用 inset 简写：Chrome 87 / Safari 14.1 以下不认，浮层会失去定位 */
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.55);
  border-radius: 14px;
  text-align: center;
}

#overlay.hidden {
  display: none;
}

#overlay-box {
  background: #fff;
  padding: 28px 34px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(30, 80, 140, 0.2);
  max-width: 90%;
}

#overlay-box h1 {
  font-size: 30px;
  color: #0b4a8f;
  letter-spacing: 1px;
}

#overlay-box .sub {
  color: #666;
  margin: 4px 0 16px;
}

#overlay-msg {
  color: #333;
  margin-bottom: 18px;
  line-height: 1.7;
}

#start {
  border: none;
  background: #0b4a8f;
  color: #fff;
  font-size: 17px;
  padding: 10px 28px;
  border-radius: 999px;
  cursor: pointer;
}

#start:hover {
  background: #0d5db3;
}

#overlay-msg .hint-more,
#overlay-msg .hint-keys {
  color: #999;
  font-size: 13px;
}

/* ---------- 窄屏（手机） ----------
   画布是 800×360 等比缩放的，手机竖屏下只有 350×160 左右 —— 比一张能读的
   卡片还矮。卡片硬塞进去就会上下溢出，还被记分牌（z-index 更高）压在脸上。
   而竖屏时画布上下其实有大片空白，所以窄屏下干脆把卡片挪到画布下方走正常流。 */
@media (max-width: 720px) {
  #overlay {
    position: static;
    display: block;
    background: none;
    border-radius: 0;
    margin-top: 10px;
  }

  #overlay-box {
    max-width: 100%;
    padding: 16px 18px;
    box-shadow: 0 6px 18px rgba(30, 80, 140, 0.16);
  }

  #overlay-box h1 {
    font-size: 22px;
  }

  /* 手机没有键盘，这条提示没意义 */
  #overlay-msg .hint-keys {
    display: none;
  }
}

/* ---------- 跳跃设置面板 ---------- */
/* 用 fixed 铺满整个窗口，而不是只盖住画布：
   画布只有 400px 出头高，塞不下整个面板，按钮会被挤到看不见的地方。 */
#settings {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(20, 45, 80, 0.38);
  overflow: auto;
}

#settings.hidden {
  display: none;
}

#settings-box {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 12px 34px rgba(20, 45, 80, 0.32);
  padding: 20px 22px;
  width: min(470px, 100%);
  max-height: calc(100vh - 32px);
  overflow: auto;
  text-align: left;
}

#settings-box h2 {
  font-size: 19px;
  color: #0b4a8f;
  margin-bottom: 2px;
}

.settings-tip {
  font-size: 12px;
  color: #8a94a6;
  line-height: 1.6;
  margin-bottom: 12px;
}

#jump-preview {
  display: block;
  width: 100%;
  height: auto;
  background: #f4f9ff;
  border: 1px solid #dbe8f7;
  border-radius: 10px;
  margin-bottom: 4px;
}

.group-title {
  font-size: 12px;
  font-weight: 600;
  color: #0b4a8f;
  letter-spacing: 1px;
  margin: 14px 0 4px;
}

.row {
  display: grid;
  grid-template-columns: 78px 1fr 84px;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
  font-size: 13px;
}

.row .name {
  color: #556;
}

.row input[type="range"] {
  width: 100%;
  accent-color: #0b4a8f;
  cursor: pointer;
}

.row .val {
  text-align: right;
  color: #0b4a8f;
  font-weight: 600;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

#settings-box .actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
}

#settings-box .actions button {
  border: none;
  border-radius: 999px;
  padding: 8px 20px;
  font-size: 14px;
  cursor: pointer;
  background: #0b4a8f;
  color: #fff;
}

#settings-box .actions button:hover {
  background: #0d5db3;
}

#settings-box .actions button.ghost {
  background: #eef3fa;
  color: #0b4a8f;
}

#settings-box .actions button.ghost:hover {
  background: #e2ebf7;
}

  </style>
</head>
<body>
  <div id="game-wrap">
    <!-- 游戏画布：所有画面都由下面的脚本画在这里 -->
    <canvas id="game"></canvas>

    <!-- 顶部记分牌 -->
    <div id="hud">
      <span class="score">分数 <b id="score">0</b></span>
      <span id="hud-btns">
        <button id="pause-btn" type="button">⏸</button>
        <button id="settings-btn" type="button" title="跳跃设置">⚙</button>
      </span>
      <span class="best">最高 <b id="best">0</b></span>
    </div>

    <!-- 开始 / 结束 浮层 -->
    <div id="overlay">
      <div id="overlay-box">
        <h1>XJTLUer Can Fly</h1>
        <p class="sub">西浦学子 · 会飞</p>
        <p id="overlay-msg">按一下 <b>空格</b> / <b>点击屏幕</b> 跳一下，躲开考试 / DDL！</p>
        <button id="start">开始</button>
      </div>
    </div>

    <!-- 跳跃设置面板（点右上角 ⚙ 打开） -->
    <div id="settings" class="hidden">
      <div id="settings-box">
        <h2>游戏设置</h2>
        <p class="settings-tip">拖动即生效，并自动记住；下次打开还是这套手感。</p>

        <canvas id="jump-preview" width="420" height="112"></canvas>

        <div class="group-title">滞空时间</div>

        <label class="row">
          <span class="name">轻按一下</span>
          <input type="range" id="cfg-min" min="40" max="200" step="5" />
          <span class="val" id="out-min">–</span>
        </label>

        <label class="row">
          <span class="name">按住上限</span>
          <input type="range" id="cfg-max" min="40" max="260" step="5" />
          <span class="val" id="out-max">–</span>
        </label>

        <label class="row">
          <span class="name">按住灵敏度</span>
          <input type="range" id="cfg-accel" min="0" max="10" step="1" />
          <span class="val" id="out-accel">–</span>
        </label>

        <div class="group-title">其它</div>

        <label class="row">
          <span class="name">跳跃高度</span>
          <input type="range" id="cfg-height" min="120" max="300" step="5" />
          <span class="val" id="out-height">–</span>
        </label>

        <label class="row">
          <span class="name">游戏速度</span>
          <input type="range" id="cfg-speed" min="0.5" max="1.5" step="0.05" />
          <span class="val" id="out-speed">–</span>
        </label>

        <div class="actions">
          <button id="settings-reset" type="button" class="ghost">恢复默认</button>
          <button id="settings-close" type="button">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script>
// ============================================================
//  XJTLUer Can Fly · 一个会飞的“小恐龙”游戏
//  主角头像：西交利物浦大学校长 席酉民 教授
//  玩法：按一下空格 / 点击屏幕跳一下（长按无效），躲开「考试 / DDL」障碍物。
// ============================================================

// ---------- 一、常量配置（想调手感就改这里） ----------
const WIDTH = 800;      // 画布逻辑宽
const HEIGHT = 360;     // 画布逻辑高
const GROUND_H = 64;    // 地面高度
const CHAR_X = 140;     // 主角固定的横向位置
const CHAR_R = 32;      // 主角（头像）半径

// 下面这几个是「可调参数」：右上角 ⚙ 面板里能随时改，改完自动记在浏览器里。
// 想改默认值就动 SETTINGS_DEFAULT，点面板里的“恢复默认”也会回到这里。
// speed 是「整体速度倍率」：1 = 下面 START_SPEED / MAX_SPEED 的原速。
const SETTINGS_DEFAULT = { height: 190, min: 80, max: 130, accel: 2, speed: 1 };

let JUMP_HEIGHT = SETTINGS_DEFAULT.height;    // 跳跃高度（像素，越大跳得越高）
let JUMP_DURATION_MIN = SETTINGS_DEFAULT.min; // 最短滞空时长（帧）：轻按一下
let JUMP_DURATION_MAX = SETTINGS_DEFAULT.max; // 最长滞空时长（帧）：按住不放的上限
let JUMP_HOLD_ACCEL = SETTINGS_DEFAULT.accel; // 按住时每帧增加多少滞空时长
let SPEED_SCALE = SETTINGS_DEFAULT.speed;     // 整体速度倍率（面板里的「游戏速度」）


const START_SPEED = 1.8;     // 初始滚动速度（基准，还要乘 SPEED_SCALE）
const MAX_SPEED = 3.6;       // 最快滚动速度（基准，还要乘 SPEED_SCALE）
const SHIELD_DURATION = 240; // 无敌护盾持续时间（帧，约 4 秒）

// ---------- 二、画布与页面元素 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = WIDTH;
canvas.height = HEIGHT;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlay-msg');

// ---------- 四、游戏状态 ----------
let player, obstacles, clouds, particles, floats, powerups;
let score, bestScore, speed, distance;
let state;            // 'ready' | 'playing' | 'paused' | 'over'
let spawnTimer;       // 距离下一个障碍物还有多久
let powerupTimer;     // 距离下一个护盾道具还有多久
let shieldTimer;      // 无敌护盾剩余帧数（>0 表示无敌）
let frame;            // 帧计数器（用于动画）

// ---------- 本地存储的唯一出口 ----------
// 有些平台会禁用 localStorage：Safari 关掉 Cookie、隐私模式、部分 App 内置浏览器、
// 某些 file:// 环境 —— 这时候连「读取」都会直接抛异常。
// 以前高分那一行裸着调 localStorage，一抛异常整个脚本就死，游戏变成一块白板。
// 现在所有存取都只走这两个函数，失败就安静降级（顶多记不住分数），绝不连累游戏。
function storageGet(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}

function storageSet(key, value) {
  try {
    window.localStorage.setItem(key, value);
  } catch (e) {
    // 存不了就算了
  }
}

// 读取本地最高分
bestScore = Number(storageGet('xjtluer_best') || 0);
bestEl.textContent = bestScore;

// ---------- 五、初始化 / 重置 ----------
function reset() {
  player = {
    x: CHAR_X,
    y: HEIGHT - GROUND_H - CHAR_R, // 开始时站在地面
    jumping: false,                // 是否正在跳跃
    jumpT: 0,                      // 跳跃进度 0→1
    jumpStartY: 0,                 // 起跳时的 y（用于落回原地）
    jumpDuration: JUMP_DURATION_MIN, // 这一次跳跃的滞空时长（按住会变长）
    holding: false,                // 跳跃键是否仍按着（按着才能延长这一次滞空）
  };
  obstacles = [];
  clouds = [];
  particles = [];
  floats = [];
  powerups = [];
  score = 0;
  speed = START_SPEED * SPEED_SCALE;
  distance = 0;
  spawnTimer = 0;
  powerupTimer = 900; // 第一个护盾稍后出现
  shieldTimer = 0;
  frame = 0;
  // 预生成几朵云
  for (let i = 0; i < 5; i++) {
    clouds.push(makeCloud(true));
  }
}

// ---------- 六、云 / 障碍物 / 粒子 ----------
function makeCloud(randomX) {
  return {
    x: randomX ? Math.random() * WIDTH : WIDTH + 60,
    y: 40 + Math.random() * 120,
    r: 18 + Math.random() * 18,
    v: 0.4 + Math.random() * 0.5, // 云飘得比地面慢，有景深感
  };
}

const OBSTACLE_TYPES = ['考试', '论文', '作业', '期中', 'DDL']; // 随机出现的障碍物种类

function spawnObstacle() {
  const h = 40 + Math.random() * 45; // 障碍物高度随机（40~85，最高也能跳过去）
  const w = 32 + Math.random() * 40; // 障碍物宽度随机（32~72）
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  obstacles.push({
    x: WIDTH + 30,
    y: HEIGHT - GROUND_H - h,        // 底部贴地
    w: w,                            // 纸张宽度（随机）
    h: h,
    type: type,
    scored: false,                   // 是否已经计分
  });
}

// 障碍物得分规则：矮的 1 分，高的 2 分（高度 >= 62 算高）
function obstacleScore(h) {
  return h >= 62 ? 2 : 1;
}

// 无敌护盾道具（吃到后一段时间内撞上障碍物也不会死）
function spawnPowerup() {
  const groundY = HEIGHT - GROUND_H - CHAR_R;
  powerups.push({
    x: WIDTH + 30,
    y: groundY - 40 - Math.random() * 90, // 出现在空中，需要跳起来接
    r: 16,
    bob: Math.random() * Math.PI * 2,     // 上下浮动相位
  });
}

// 道具当前 y（含上下浮动）
function powerupY(p) {
  return p.y + Math.sin(frame * 0.08 + p.bob) * 6;
}

// 加分飘字
function addFloat(text) {
  floats.push({
    x: player.x + CHAR_R + 6,
    y: player.y - CHAR_R,
    text: text,
    life: 1,
  });
}

function addParticles() {
  // 飞行时身后的小拖尾
  particles.push({
    x: player.x - CHAR_R * 0.6,
    y: player.y + (Math.random() - 0.5) * CHAR_R,
    r: 2 + Math.random() * 3,
    life: 1,
  });
}

// ---------- 七、更新逻辑 ----------
function update() {
  if (state !== 'playing') return;
  frame++;

  // 1) 主角跳跃：用正弦曲线实现「缓升缓降」（先加速后减速，很顺滑）
  const groundY = HEIGHT - GROUND_H - CHAR_R;
  if (player.jumping) {
    // 按住不放：这一次跳跃的滞空时间慢慢变长，最多到 JUMP_DURATION_MAX。
    // 松手就停在当前时长，于是「轻按＝快跳一下，按住＝飘得久一点」。
    // 注意：改的是“进度推进的速率”，位置只由 jumpT 决定，所以弧线依然连续、不跳帧。
    if (player.holding) {
      player.jumpDuration = Math.min(JUMP_DURATION_MAX, player.jumpDuration + JUMP_HOLD_ACCEL);
    }
    player.jumpT += 1 / player.jumpDuration; // 推进进度 0→1
    if (player.jumpT >= 1) {
      player.jumpT = 1;
      player.jumping = false;          // 落回地面
      player.holding = false;          // 落地即结束这一次按键，按着也不会自动再跳
    }
    // sin(π·t)：0 → 1 → 0，天然是“缓升缓降”的缓动曲线
    player.y = player.jumpStartY - JUMP_HEIGHT * Math.sin(Math.PI * player.jumpT);
    // 上升阶段（前一半）加一点小拖尾
    if (player.jumpT < 0.5 && frame % 3 === 0) addParticles();
  } else {
    player.y = groundY;                // 不跳时就贴地
  }

  // 2) 障碍物向左移动，移出屏幕后删除
  for (const ob of obstacles) ob.x -= speed;
  obstacles = obstacles.filter((ob) => ob.x + ob.w > -20);

  // 2.5) 成功越过一个障碍物就加分：矮的 1 分，高的 2 分，并弹出飘字
  for (const ob of obstacles) {
    if (!ob.scored && ob.x + ob.w < player.x - CHAR_R) {
      ob.scored = true;
      const pts = obstacleScore(ob.h);
      score += pts;
      addFloat('+' + pts);
    }
  }

  // 3) 云向左飘
  for (const c of clouds) c.x -= c.v;
  clouds = clouds.filter((c) => c.x + c.r > 0);
  if (clouds.length < 5 && Math.random() < 0.01) clouds.push(makeCloud(false));

  // 4) 粒子动画
  for (const p of particles) {
    p.x -= speed * 0.8;
    p.life -= 0.04;
  }
  particles = particles.filter((p) => p.life > 0);

  // 4.5) 加分飘字动画（向上飘 + 淡出）
  for (const f of floats) {
    f.y -= 0.8;
    f.life -= 0.025;
  }
  floats = floats.filter((f) => f.life > 0);

  // 5) 生成新障碍物（越跑越快）
  spawnTimer -= speed;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 320 + Math.random() * 240; // 障碍物间隔（随机变化，有宽有窄）
  }

  // 5.5) 生成无敌护盾道具（场上最多一个）
  powerupTimer -= speed;
  if (powerupTimer <= 0 && powerups.length === 0) {
    spawnPowerup();
    powerupTimer = 1600 + Math.random() * 1200;
  }

  // 6) 距离与速度：速度随前进距离缓慢提升，最后再乘上玩家设置的整体速度倍率
  distance += speed;
  speed = Math.min(MAX_SPEED, START_SPEED + distance / 8000) * SPEED_SCALE;

  // 6.5) 护盾道具移动、拾取、无敌倒计时
  for (const p of powerups) p.x -= speed;
  powerups = powerups.filter((p) => p.x + p.r > -20);
  for (const p of powerups) {
    const dx = player.x - p.x;
    const dy = player.y - powerupY(p);
    if (dx * dx + dy * dy < (CHAR_R + p.r) * (CHAR_R + p.r)) {
      shieldTimer = SHIELD_DURATION;
      playShield();
      powerups = powerups.filter((o) => o !== p);
      break;
    }
  }
  if (shieldTimer > 0) shieldTimer--;

  // 7) 障碍物碰撞检测（有护盾时撞碎障碍物，不掉命）
  const smashed = [];
  for (const ob of obstacles) {
    if (circleRect(player.x, player.y, CHAR_R * 0.8, ob.x, ob.y, ob.w, ob.h)) {
      if (shieldTimer > 0) {
        smashed.push(ob);
      } else {
        gameOver();
        return;
      }
    }
  }
  if (smashed.length) obstacles = obstacles.filter((o) => !smashed.includes(o));
}

// 圆形与矩形是否相交（碰撞检测）
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx;
  const dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

// ---------- 八、绘制 ----------
function draw() {
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  sky.addColorStop(0, '#8fd3ff');
  sky.addColorStop(1, '#e8f7ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // 太阳
  ctx.fillStyle = '#ffd76a';
  ctx.beginPath();
  ctx.arc(720, 70, 34, 0, Math.PI * 2);
  ctx.fill();

  // 云
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.9, c.y + 4, c.r * 0.75, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.9, c.y + 4, c.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面
  ctx.fillStyle = '#e8ddc4';
  ctx.fillRect(0, HEIGHT - GROUND_H, WIDTH, GROUND_H);
  ctx.fillStyle = '#5a8f3c';
  ctx.fillRect(0, HEIGHT - GROUND_H, WIDTH, 8);

  // 障碍物（考试 / DDL 纸张）
  for (const ob of obstacles) drawObstacle(ob);

  // 无敌护盾道具
  for (const p of powerups) drawPowerup(p);

  // 粒子拖尾
  for (const p of particles) {
    ctx.fillStyle = 'rgba(255,255,255,' + p.life + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 加分飘字
  for (const f of floats) drawFloat(f);

  drawPlayer();
}

// 画一个「考试 / DDL」纸张障碍物
function drawObstacle(ob) {
  const x = ob.x, y = ob.y, w = ob.w, h = ob.h;
  ctx.save();

  // 纸张本体
  ctx.fillStyle = '#fffdf5';
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.strokeStyle = '#d8d0c2';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 顶部红色标题栏「考试」
  const headH = Math.min(24, h - 6);
  ctx.fillStyle = '#c62828';
  roundRect(x, y, w, headH, 4);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ob.type, x + w / 2, y + headH / 2);

  // 纸张上的“文字行”
  ctx.fillStyle = '#b9b0a2';
  for (let i = 0; i < 3; i++) {
    const ly = y + headH + 9 + i * 8;
    if (ly < y + h - 10) ctx.fillRect(x + 7, ly, w - 14, 3);
  }

  // 底部红色「DDL!」章（太窄的纸张不画，避免超出）
  if (h >= 64 && w >= 44) {
    ctx.save();
    ctx.translate(x + w / 2, y + h - 17);
    ctx.rotate(-0.28);
    ctx.fillStyle = 'rgba(211, 47, 47, 0.88)';
    roundRect(-19, -9, 38, 18, 3);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('DDL!', 0, 1);
    ctx.restore();
  }

  ctx.restore();
}

// 画无敌护盾道具（发光蓝球 + “盾”字）
function drawPowerup(p) {
  const y = powerupY(p);
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#2aa7ff';
  ctx.beginPath();
  ctx.arc(p.x, y, p.r + 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1293f5';
  ctx.beginPath();
  ctx.arc(p.x, y, p.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('盾', p.x, y + 1);
  ctx.restore();
}

// 画加分飘字（向上飘 + 淡出，+2 用金色更大）
function drawFloat(f) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, f.life);
  ctx.fillStyle = f.text === '+2' ? '#f57c00' : '#2e7d32';
  ctx.font = f.text === '+2' ? 'bold 24px "Microsoft YaHei", sans-serif' : 'bold 20px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.text, f.x, f.y);
  ctx.restore();
}

function drawPlayer() {
  // 翅膀：上升时上扑，下落 / 落地时下收
  const rising = player.jumping && player.jumpT < 0.5;
  const flap = Math.sin(frame * 0.25) * 0.5 + (rising ? 0.7 : -0.3);
  ctx.save();
  ctx.translate(player.x, player.y);

  // 左翅 / 右翅
  ctx.fillStyle = '#0b4a8f';
  wing(-CHAR_R - 2, flap);
  wing(CHAR_R + 2, flap);

  // 头像（圆形）
  if (avatar.complete && avatar.naturalWidth) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, CHAR_R, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(avatar, -CHAR_R, -CHAR_R, CHAR_R * 2, CHAR_R * 2);
    ctx.restore();
  } else {
    // 头像未加载完成时的占位圆
    ctx.fillStyle = '#0b4a8f';
    ctx.beginPath();
    ctx.arc(0, 0, CHAR_R, 0, Math.PI * 2);
    ctx.fill();
  }

  // 无敌护盾光环（脉冲蓝圈）
  if (shieldTimer > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(42, 167, 255,' + (0.35 + 0.25 * Math.sin(frame * 0.2)) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, CHAR_R + 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

// 画一个翅膀（简单的椭圆，按 flap 旋转）
function wing(x, flap) {
  ctx.save();
  ctx.translate(x, 0);
  ctx.rotate(flap);
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 圆角矩形工具
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ---------- 九、游戏流程 ----------
function gameOver() {
  state = 'over';
  playGameOver();
  pauseBtn.style.display = 'none';
  if (Math.floor(score) > bestScore) {
    bestScore = Math.floor(score);
    storageSet('xjtluer_best', bestScore);
    bestEl.textContent = bestScore;
  }
  overlayMsg.innerHTML = '得分 <b>' + Math.floor(score) + '</b> · 最高 <b>' + bestScore +
    '</b><br>撞上障碍物啦，再来一次！';
  startBtn.textContent = '再玩一次';
  overlay.classList.remove('hidden');
}

function start() {
  reset();
  state = 'playing';
  overlay.classList.add('hidden');
  pauseBtn.style.display = 'inline-block';
  pauseBtn.textContent = '⏸';
}

function pause() {
  if (state !== 'playing') return;
  state = 'paused';
  overlayMsg.innerHTML = '已暂停';
  startBtn.textContent = '继续';
  overlay.classList.remove('hidden');
  pauseBtn.textContent = '▶';
}

function resume() {
  if (state !== 'paused') return;
  state = 'playing';
  overlay.classList.add('hidden');
  pauseBtn.textContent = '⏸';
}

// ---------- 十、主循环 ----------
function loop() {
  update();
  draw();
  scoreEl.textContent = Math.floor(score);
  requestAnimationFrame(loop);
}

// ---------- 十一、音效（Web Audio 现场生成，无需额外文件） ----------
let audioCtx = null;

// 浏览器要求用户先有操作才能出声，所以第一次交互时再创建
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  // iOS Safari：AudioContext 常常一开始是 suspended 状态，
  // 光创建不 resume 是没声音的（而且必须在用户手势里调用）。
  if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) {
    audioCtx.resume();
  }
}

// 跳跃音：短促上扬的“咻”
function playJump() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(320, t);
  osc.frequency.exponentialRampToValueAtTime(640, t + 0.12);
  gain.gain.setValueAtTime(0.25, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.16);
}

// 失败音：下沉的“嗡嗡”声
function playGameOver() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.exponentialRampToValueAtTime(70, t + 0.35);
  gain.gain.setValueAtTime(0.2, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.42);
}

// 护盾音：上扬的双音“叮”
function playShield() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [520, 780].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, t + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.22, t + i * 0.08 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t + i * 0.08);
    osc.stop(t + i * 0.08 + 0.2);
  });
}

// ---------- 十二、输入控制 ----------
// 一次按键 = 一次跳跃，只有在地面上才起跳；空中再按无效（不会二段跳）
function jump() {
  if (!player.jumping) {          // 只有落地时才能跳
    player.jumping = true;
    player.jumpT = 0;
    player.jumpStartY = player.y;            // 记录起跳点，跳完正好落回原地
    player.jumpDuration = JUMP_DURATION_MIN; // 每次起跳都从最短滞空开始
    player.holding = true;                   // 按着不放可以延长这一次的滞空
    playJump();
  }
}

// 松开跳跃键：这一次跳跃的滞空时长就定在松手的那一刻
function releaseJump() {
  if (player) player.holding = false;
}

window.addEventListener('keydown', (e) => {
  // 设置面板开着的时候，键盘只服务面板（Esc 关闭），别顺手把游戏重开 / 暂停了
  if (!settingsPanel.classList.contains('hidden')) {
    if (e.code === 'Escape') {
      e.preventDefault();
      closeSettings();
    }
    return;
  }
  // R：随时重开
  if (e.code === 'KeyR') {
    e.preventDefault();
    start();
    return;
  }
  // P / Esc：暂停或继续
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (state === 'playing') pause();
    else if (state === 'paused') resume();
    return;
  }
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    // 长按系统会不停重复发送 keydown：这些重复事件不算「新的一次按键」，
    // 否则落地后会被重复事件顶起来，变成一直连跳。
    if (e.repeat) return;
    if (state === 'ready') start();
    else if (state === 'paused') { resume(); return; }
    else if (state === 'over') { start(); jump(); return; }
    jump();
  }
});

// 松开空格 / ↑：这一次跳跃的滞空时长就定下来了
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') releaseJump();
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === 'ready') start();
  else if (state === 'paused') { resume(); return; }
  else if (state === 'over') { start(); jump(); return; }
  jump();
});

// 鼠标 / 手指松开就算松手（在画布外面松开也算），避免“一直按着”卡住
window.addEventListener('pointerup', releaseJump);
window.addEventListener('pointercancel', releaseJump);

startBtn.addEventListener('click', () => {
  if (state === 'paused') resume();
  else start();
});
pauseBtn.addEventListener('click', () => {
  if (state === 'playing') pause();
  else if (state === 'paused') resume();
});

// ---------- 十三、跳跃设置面板 ----------
// 面板上的滑块直接改上面那几个 let 变量，改完立刻生效并存进 localStorage。
const SETTINGS_KEY = 'xjtluer_jump_settings';

// 每一项的可调范围，顺便挡住存档里出现离谱数字
const SETTINGS_RANGE = {
  height: [120, 300],
  min: [40, 200],
  max: [40, 260],
  accel: [0, 10],
  speed: [0.5, 1.5],
};

const settingsPanel = document.getElementById('settings');
const settingsBtn = document.getElementById('settings-btn');
const settingsCloseBtn = document.getElementById('settings-close');
const settingsResetBtn = document.getElementById('settings-reset');
const previewCanvas = document.getElementById('jump-preview');

const sliders = {
  height: document.getElementById('cfg-height'),
  min: document.getElementById('cfg-min'),
  max: document.getElementById('cfg-max'),
  accel: document.getElementById('cfg-accel'),
  speed: document.getElementById('cfg-speed'),
};
const readouts = {
  height: document.getElementById('out-height'),
  min: document.getElementById('out-min'),
  max: document.getElementById('out-max'),
  accel: document.getElementById('out-accel'),
  speed: document.getElementById('out-speed'),
};

let settingsOpenedFromPlay = false; // 关掉面板后要不要自动继续游戏

function clampNum(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function secText(frames) {
  return (frames / 60).toFixed(1) + ' 秒';
}

// 用和游戏里完全一样的推进方式模拟一次跳跃，返回每一帧的相位 p（0→1）。
// holdFrames = 按住多少帧后松手；Infinity 表示一直按住。
function simulateJump(holdFrames) {
  const pts = [0];
  let dur = JUMP_DURATION_MIN;
  let p = 0;
  let cappedAt = -1;
  for (let f = 0; f < 4000 && p < 1; f++) {
    if (f < holdFrames && dur < JUMP_DURATION_MAX) {
      dur = Math.min(JUMP_DURATION_MAX, dur + JUMP_HOLD_ACCEL);
      if (dur >= JUMP_DURATION_MAX && cappedAt < 0) cappedAt = f + 1;
    }
    p = Math.min(1, p + 1 / dur);
    pts.push(p);
  }
  return { pts: pts, frames: pts.length - 1, cappedAt: cappedAt };
}

// 画预览：两条弧线分别是「轻按」和「按住上限」，横轴是时间，纵轴是高度
function drawJumpPreview() {
  if (!previewCanvas) return;
  const g = previewCanvas.getContext('2d');
  const W = previewCanvas.width;
  const H = previewCanvas.height;
  g.clearRect(0, 0, W, H);

  const padX = 10;
  const padTop = 24;
  const groundY = H - 16;
  const tap = simulateJump(0);
  const hold = simulateJump(Infinity);
  const topFrame = Math.max(tap.frames, hold.frames, 1);
  const yScale = (groundY - padTop) / Math.max(JUMP_HEIGHT, 1);

  // 地面
  g.strokeStyle = '#c9d8ea';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(0, groundY + 0.5);
  g.lineTo(W, groundY + 0.5);
  g.stroke();

  // 最高障碍物（85 像素）的参考线：顶点要明显高过它才跳得过去
  const obstacleY = groundY - 85 * yScale;
  if (obstacleY > padTop + 4) {
    g.save();
    g.setLineDash([4, 4]);
    g.strokeStyle = '#eaa9a9';
    g.beginPath();
    g.moveTo(0, obstacleY);
    g.lineTo(W, obstacleY);
    g.stroke();
    g.restore();
    g.fillStyle = '#cf8b8b';
    g.font = '10px "Microsoft YaHei", sans-serif';
    g.textAlign = 'right'; // 放右边：弧线在右边已经落到地面，不会压到字
    g.textBaseline = 'bottom';
    g.fillText('最高障碍物', W - 4, obstacleY - 2);
  }

  function plot(arc, color, width) {
    g.strokeStyle = color;
    g.lineWidth = width;
    g.beginPath();
    for (let i = 0; i < arc.length; i++) {
      const x = padX + (i / topFrame) * (W - padX * 2);
      const y = groundY - JUMP_HEIGHT * Math.sin(Math.PI * arc[i]) * yScale;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.stroke();
  }

  plot(hold.pts, 'rgba(11, 74, 143, 0.35)', 2); // 按住（更长，浅色）
  plot(tap.pts, '#0b4a8f', 2.5);                // 轻按（更短，深色）

  g.font = '10px "Microsoft YaHei", sans-serif';
  g.textAlign = 'right';
  g.textBaseline = 'top';
  g.fillStyle = 'rgba(11, 74, 143, 0.5)';
  g.fillText('按住 ' + secText(hold.frames), W - padX, 4);
  g.fillStyle = '#0b4a8f';
  g.fillText('轻按 ' + secText(tap.frames), W - padX, 15);
}

// 把当前数值写回滑块和读数，并重画预览
function syncSettingsUI() {
  sliders.height.value = String(JUMP_HEIGHT);
  sliders.min.value = String(JUMP_DURATION_MIN);
  sliders.max.value = String(JUMP_DURATION_MAX);
  sliders.accel.value = String(JUMP_HOLD_ACCEL);
  sliders.speed.value = String(SPEED_SCALE);

  const tap = simulateJump(0);
  const hold = simulateJump(Infinity);

  readouts.height.textContent = JUMP_HEIGHT + ' px';
  readouts.speed.textContent = Math.round(SPEED_SCALE * 100) + '%';
  readouts.min.textContent = secText(tap.frames);
  readouts.max.textContent = secText(hold.frames);

  if (JUMP_HOLD_ACCEL <= 0 || JUMP_DURATION_MAX <= JUMP_DURATION_MIN) {
    readouts.accel.textContent = '按住无效';
  } else if (hold.cappedAt < 0) {
    readouts.accel.textContent = '按不满';
  } else {
    readouts.accel.textContent = '约 ' + secText(hold.cappedAt) + '到顶';
  }

  drawJumpPreview();
}

function saveSettings() {
  storageSet(SETTINGS_KEY, JSON.stringify({
    height: JUMP_HEIGHT,
    min: JUMP_DURATION_MIN,
    max: JUMP_DURATION_MAX,
    accel: JUMP_HOLD_ACCEL,
    speed: SPEED_SCALE,
  }));
}

function applySettings(s, save) {
  if (s) {
    if (typeof s.height === 'number') JUMP_HEIGHT = clampNum(Math.round(s.height), SETTINGS_RANGE.height[0], SETTINGS_RANGE.height[1]);
    if (typeof s.min === 'number') JUMP_DURATION_MIN = clampNum(Math.round(s.min), SETTINGS_RANGE.min[0], SETTINGS_RANGE.min[1]);
    if (typeof s.max === 'number') JUMP_DURATION_MAX = clampNum(Math.round(s.max), SETTINGS_RANGE.max[0], SETTINGS_RANGE.max[1]);
    if (typeof s.accel === 'number') JUMP_HOLD_ACCEL = clampNum(Math.round(s.accel), SETTINGS_RANGE.accel[0], SETTINGS_RANGE.accel[1]);
    // 倍率是小数，不能像上面几项那样取整
    if (typeof s.speed === 'number') SPEED_SCALE = clampNum(s.speed, SETTINGS_RANGE.speed[0], SETTINGS_RANGE.speed[1]);
  }
  // 「按住上限」不能比「轻按」还短
  if (JUMP_DURATION_MAX < JUMP_DURATION_MIN) JUMP_DURATION_MAX = JUMP_DURATION_MIN;

  if (save) saveSettings();
  syncSettingsUI();
}

function applySettingsFromUI(changed) {
  let min = Number(sliders.min.value);
  let max = Number(sliders.max.value);
  if (max < min) {
    // 谁被拖动就以谁为准，另一个跟着让路
    if (changed === 'max') min = max;
    else max = min;
  }
  applySettings({
    height: Number(sliders.height.value),
    min: min,
    max: max,
    accel: Number(sliders.accel.value),
    speed: Number(sliders.speed.value),
  }, true);
}

function loadSettings() {
  const raw = storageGet(SETTINGS_KEY);
  if (!raw) return;
  try { applySettings(JSON.parse(raw), false); } catch (e) { /* 存档坏了就退回默认值 */ }
}

function openSettings() {
  if (!settingsPanel.classList.contains('hidden')) return;
  settingsOpenedFromPlay = (state === 'playing');
  if (settingsOpenedFromPlay) pause(); // 先暂停，免得边调边撞上障碍物
  syncSettingsUI();
  settingsPanel.classList.remove('hidden');
}

function closeSettings() {
  settingsPanel.classList.add('hidden');
  if (settingsOpenedFromPlay) {
    settingsOpenedFromPlay = false;
    resume();
  }
}

function bindSettingsUI() {
  Object.keys(sliders).forEach((key) => {
    const handler = () => applySettingsFromUI(key);
    sliders[key].addEventListener('input', handler);
    sliders[key].addEventListener('change', handler);
  });

  settingsBtn.addEventListener('click', openSettings);
  settingsCloseBtn.addEventListener('click', closeSettings);
  settingsResetBtn.addEventListener('click', () => {
    applySettings({ height: SETTINGS_DEFAULT.height, min: SETTINGS_DEFAULT.min, max: SETTINGS_DEFAULT.max,
                    accel: SETTINGS_DEFAULT.accel, speed: SETTINGS_DEFAULT.speed }, true);
  });
  // 点面板外面的灰色区域也能关掉
  settingsPanel.addEventListener('click', (e) => {
    if (e.target === settingsPanel) closeSettings();
  });

  syncSettingsUI();
}

// ---------- 启动 ----------
loadSettings();   // 先把上次保存的跳跃手感读回来
bindSettingsUI(); // 绑好设置面板的滑块
reset();
state = 'ready';
overlayMsg.innerHTML = '按一下 <b>空格</b> / <b>点击屏幕</b> 跳一下，躲开考试 / DDL！' +
  '<span class="hint-more"><br>轻按＝快跳一下 · 按住不放滞空更久（有上限）</span>' +
  '<span class="hint-keys"><br>P 暂停 · R 重开 · ⚙ 右上角可调跳跃手感</span>';
startBtn.textContent = '开始';
pauseBtn.style.display = 'none';
overlay.classList.remove('hidden');
loop();

  </script>
</body>
